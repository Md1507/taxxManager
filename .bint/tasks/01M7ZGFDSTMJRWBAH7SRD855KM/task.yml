  - 'Sửa sau review vòng1 trước bàn giao: finding .1 buglow OverpaymentContextBasis đang Clause1 nhưng summary nói nộp thừa và thủ tục; đối chiếu bản ký trang56 Điều68(1),(2)a,(4), chọn Clause=1,2,4 hoặc tách căn cứ chính xác, không Pointa gán nhầm chung khoản; thêm assertion seed/provenance metadata đúng. Đồng thời xử lý suggestion .2 test tràn tổng BH hiện bị overflow phép trừ tháng trước khi tới tổng năm. Tạo fixture tổng BH năm tràn mà từng tháng tính được và có valid control tránh cả tràn thu nhập/tax/actual/deduction trước; giữ test monthly subtractionoverflow riêng nếu hữu ích. Đọc đầy đủ findings/evidence. Chỉ sửa tối thiểu trong scope S15d, không làm yếu test hoặc guard. Chạy Core rồi solution no-restore, cập nhật docs0009 count thật và bằng chứngAC4/6/7/chế độkhác nếu cần. Không dùng bint findings set fixed nếu đòi SHA commit thật: user chưa commit, không giả SHA; ghi nội dung đã sửa và chờ reviewer xác nhận. Không stage/commit/index/HEAD/config/PLAN/oldledger.'
