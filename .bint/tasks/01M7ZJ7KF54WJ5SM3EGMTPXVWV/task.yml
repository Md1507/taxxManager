request: |-
  Chỉ thực hiện bước kế tiếp S15e / BL-23e theo PLAN.md: giảm trừ đóng góp từ thiện, nhân đạo, khuyến học khi ước tính thuế lương năm 2026. User: sang bước tiếp. Phụ thuộc S15d 01M7ZGFDSTMJRWBAH7SRD855KM đãdone. Một bước/lượt, Core trước Web/DB. Mục tiêu có model khoản đóng góp có ngày/ID/nhóm tổ chức/điều kiện/chứng từ rõ, quy tắc và trích dẫn theo kỳ trong TaxRuleSet; tính phần đủ điều kiện, ghi lý do chưa đủ và áp dụng một lần vào kết quả thuế năm với PIT/delta/nộp thêm/nộp thừa cập nhật nhất quán. Hỗ trợ dữ liệu năm một nguồn qua engine AnnualSalary và nhiều nguồn thông thường S15d, tái sử dụng API thay vì tính thuế mỗi payer. Chỉ tiền VND trong nước do một cá nhân Việt Nam cư trú đóng trong năm dương lịch2026; không định giá hiện vật, không thu nhập kinh doanh/nonresident/forex/gross-up, không từthiện trực tiếp tới cá nhân. Không S15f hưu trí, y tế/giáo dục hoặc các tính năng kế tiếp.

  Nguồn chính root đã mở URL chính thức và xem trọn các PNG: Nghị định253/2026/NĐ-CP https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/7/253m-ndcp.signed.pdf . Trang34 Điều49(1)a,b,c có3 nhóm: tổ chức/cơ sở chăm sóc nuôi dưỡng trẻ em hoàn cảnh đặc biệt, người khuyết tật, người già không nơi nương tựa; quỹ từthiện/nhânđạo/khuyếnhọc; tổ chức chức năng huy động tài trợ thành lập và hoạt động theo pháp luật. Đoạn sau yêu cầu cơ quan có thẩm quyền cho phép/công nhận, mục đích từthiện/nhânđạo/khuyếnhọc và không lợi nhuận. Chứng từ là bản chụp chứng từ thu hợp pháp của tổ chức/cơ sở/quỹ HOẶC chứng từ thanh toán không tiền mặt qua tổ chức tín dụng. Trang35 Điều49(5): phát sinh năm nào giảm năm đó, không chuyển trừ năm tiếp theo. Không gán Điều49(3),(4) riêng khoản y tế/giáo dục thành điều kiện đặc thù từthiện. LuậtTNCN hợp nhất112/VBHN-VPQH chính thức ở https://xaydungchinhsach.chinhphu.vn/luat-thue-thu-nhap-ca-nhan-119260623093630882.htm (link fulltext PDF12 từ trang) root xem trang9 Điều11(1)a,b,c,(3): điều kiện hóa đơn/chứng từ và không được chi trả từ các nguồn khác, áp cho các khoản trong Điều11. Dùng đúng documentnumber/hợpnhất và luật được hợp nhất, không bịa mãvăn bản. CácPDF/PNG có sẵn C:/Users/LENOVO/AppData/Local/Temp/taxxManager-s14-sources/112-vbhn-vpqh.pdf,112-page-9.png,253-page-34.png,253-page-35.png; không tải lại/copy luậttoànvăn vào repo. Áp dụng thu nhập lương kỳ2026 Điều69(1)a, chuyển tiếp70(2); hiệu lực ngày01/07 không đồng nghĩa chỉ hỗ trợ đóng góp H2 nếu rulecho cảkỳ2026. Căn cứtính trước thuế Luật8(2),11 và NĐ46(2)c; kỳnăm66(1)a; nộpthừa/thủtục68(1),(2),(4) tránh sai khoản như S15d. Rule/basis vẫnUnverified/VerifiedOn null; input/chứngtừ do caller khai Missing; engine không gọi mạng hoặc tự xác minh tổ chức/hồsơ.

  Không có mức tiền/trần mới cho từthiện trong Điều49(1),(5); đừng lấy ngưỡng y tế/giáo dục hoặc quy tắc TT111 cũ trộn vào. Giữ decimal không làm tròn. Toàn bộ sốthuế/giảmtrừ gia cảnh dùng lại seedTaxRuleSet hiện có, không hardcode vào algorithm. Khấu trừ THỰC TẾ giữ nguyên, không làm thành 0 hoặc dựkiến; contribution không giảm trực tiếp tiềnthuế1đổi1, phải giảm thu nhập rồi tínhlại biểu năm. Tổng đónggóp đủ điều kiện dù lớn hơn thu nhập không tạo thuế âm, tiền hoàn từ riêng contribution hoặc chuyển lỗsangnăm sau; phân biệt khoản khai/đủ điều kiện/ảnh hưởng thu nhập nếu modelhiện rõ, không bịa legal ceiling. Không tựphân bổ khấu trừ hay giảm trừ về mỗi payer/tháng. Ngày phát sinh/ID phải tườngminh; sai năm ngoài coverage reject rõ hoặc biểu diễn excludedkhácnăm có thiết kếnhấtquán, không tựđổi ngày chứngtừ thành năm đónggóp. ID Trim/Ordinal chốngtrùng toàn năm, dữ liệu copy/read-only. Chứngtừ tham chiếu do caller cungcấp, khôngnhận/uploadlưu PDFthật. Khoản thiếu chứng từ hoặc khôngđủ điều kiện phải reject tườngminh hoặc line0vớireason, không im lặng cho trừ. Default/unsupported enum reject, chứngtừ 2nhánh hợp lệđộc lập; xácnhận tựchi vàkhôngchi/trừtrùng cần rõ. Chỉ yêu cầuthông tinphùhợp điều kiện, không dựng approvalflow human cho mỗi khoản. Không từ result record côngkhai init giả mạo suyra taxableYear thật: ưu tiên nhận input nguyên bản và engine hiệncó rồi trả result nhấtquán. B-req quyếtđịnh cách tíchhợp tối thiểu, có overload/trailing optional tươngthích hoặc wrapper mới từ input thật, không làm thaysemantics các API/seed cũ. Những field before/taxable/PIT/deductions/withheld/delta phải đồngnhất, không Annual result cũ hiểu là sau giảm từthiện mà PIT giữcũ. Nêu rõ monthly tax là trước giảm trừ quyết toán nếu chỉgiảm ở năm, không giả làm recalculation khấu trừ đãxảyra. Không importbonus/extras/casual vào nhiều nguồn khi S15d đã loại.

