# Phiếu tác vụ Bint (mục 6.7). Sửa được bằng tay hoặc `bint task set`.
# verify.command chỉ được Bint chạy sau khi người xác nhận (`bint task approve`),
# trừ khi trùng eval.test_command đã xác nhận trong cấu hình.
id: 01M836910PQRDBHEP832K8K2CP
goal: Hoàn thành toàn bộ tích hợp EF mã hóa + audit atomic + migration/upgrader + docs/tests 2.3; không dừng sau helper/keyring
request: |-
  Thực hiện Bước 2.3 PLAN.md sau khi Bước 2.2 đã done, theo yêu cầu mới người dùng: làm theo đánh giá database rồi sang bước tiếp theo. Bảo vệ dữ liệu nhạy cảm và audit trước khi thêm lịch sử tính toán. Đây là tác vụ riêng về mã hóa/audit và quy tắc xóa; chưa triển khai Web/Identity hay tính năng pháp lý mới.
  Planner đọc PLAN.md, ADR0013/0014, toàn bộ TaxManager.Data và tests liên quan; lập kế hoạch deep, dùng official Microsoft technical docs khi cần. Chỉ dữ liệu giả. Không thu thêm CCCD/MST. Chọn phương án chuẩn .NET (AES-GCM hoặc ASP.NET Core Data Protection), khóa bền nằm ngoài source/repo/database và có hướng dẫn backup/restore, không tự tạo key thật của người dùng hay migrate DB hiện hữu. Names và số tiền thu nhập/bảo hiểm/thuế đã khấu trừ cần được mã hóa at rest; xác định rõ metadata nào còn plaintext và giới hạn bảo vệ. Lỗi thiếu/sai khóa, ciphertext hỏng hoặc bị tráo ngữ cảnh phải fail rõ, không trả0/empty/đọc plaintext ngầm; không log payload hoặc secret. Không tự chế thuật toán mật mã. Test dùng key và DB synthetic cô lập.
  Audit cho thêm/sửa/xóa thu nhập và thay đổi khai báo người phụ thuộc/khoảng giảm trừ, kèm actor/context tường minh, UTC timestamp, action/entity/id và correlation nếu phù hợp. Audit và thay đổi nghiệp vụ phải atomic sync/async; không có thay đổi thì không ghi log giả, không lộ tên/số tiền plaintext trong audit. Xem xét batch, rollback, caller-owned transaction, cancellation/SaveChanges(false), retries, cascade delete. Audit application append-only được enforce qua đường API được hỗ trợ; không tuyên bố chống sửa bởi admin SQLite hay đã có phân quyền. Với xóa hồ sơ, thiết kế tường minh để cascade không âm thầm xóa audit cần giữ hoặc lưu lại dữ liệu nhạy cảm trái policy; tách xóa thông thường và purge nếu cần, không bịa thời hạn lưu pháp lý. Chưa auth thì actor chỉ là metadata caller, không phải danh tính đã xác thực.
  Thiết kế nâng cấp dữ liệu cũ: giữ nguyên byte hai migrations đã có (InitialPersistence và AddMonthlyTaxRules). Nếu đổi schema thêm migration mới; không giữ tiền/names plaintext trong cột legacy sau chuyển đổi thành công. Không chạy trên src/TaxManager.Data/taxmanager.local.db. Cân nhắc SQLite file/WAL/backup có thể còn bytes cũ và ghi rõ quy trình, không hứa mở file không thấy dữ liệu sau UPDATE nếu chưa xử lý di tích cũ. Kiểm chứng fresh DB và upgrade synthetic có dữ liệu, rollback/corrupt key không mất dữ liệu. Luật công khai không cần mã hóa; strict source gate và Core giữ nguyên. Preserve S21/S22 working-tree baseline; review task-only delta, không stage/commit/unstage/reset/stash/push. HEAD/index bất biến. Không thay .bint config/models/dependencies versions; có thể thêm framework reference chuẩn nếu hợp lý và giải thích. verify.command giữ trống; chạy development checks trực tiếp, không tự approve. Models theo cấu hình hiện tại.
  File organization theo feature, mỗi primary type handwritten một file, tests hành vi riêng và fixtures chung. docs ADR0015/development, sơ đồ schema trong docs/database-schema.md (người dùng cần xem quan hệ), PLAN ghi rõ mức hoàn tất/test/review và giới hạn. Trong PLAN thêm bước 2.4 lịch sử tính toán trước Web: input/result snapshot, RuleId+Version/provenance/calc-engine version/UTC timestamp, immutable sau lưu, mã hóa theo 2.3; mô tả quy tắc xóa liên quan. Chưa implement2.4 trong tác vụ này. Nguyên tắc: người dùng review bảo mật trước dữ liệu thật, nhưng hoàn thành code/tests/review trước khi xin xác nhận cuối cùng. Không dừng ở đề xuất hay phần code nhỏ khi còn việc đã được giao. Full Core+Data regressions và tests mới, migration/model consistency, fault/atomicity/confidentiality tests thực tế.
verify:
  command: ""
  criteria:
    - Sensitive fields and audit payload remain confidential in SQLite; external durable keys, authenticated context-bound protection, fail-closed corruption/key handling and documented recovery boundaries.
    - Income/dependent declaration audit is atomic with supported sync/async writes including errors/caller transactions, actor semantics truthful, deletion and purge behavior explicit and tested.
    - New migration and explicit synthetic upgrade preserve old migrations and data; existing Core/Data regressions pass with meaningful crypto, audit, migration and failure tests; no user DB or Git index/HEAD mutations.
    - Feature files readable; ADR0015/schema/development/PLAN accurate, step2.4 planned; independent review completed and security manual-review requirement clearly reported before real-data use.
scope:
  allow:
    - src/TaxManager.Data/**
    - tests/TaxManager.Data.Tests/**
    - docs/decisions/0015-data-protection-audit.md
    - docs/development.md
    - docs/database-schema.md
    - PLAN.md
  deny: []
references:
  - PLAN.md
