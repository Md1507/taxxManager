goal: 'Thực hiện đúng Bước 2.2 PLAN.md sau S21: persist TaxRuleSet, bậc thuế, metadata LegalBasis và khoảng kỳ áp dụng trong SQLite; seed tham khảo2025/2026; dựng TaxRuleProvider từ DB và chứng minh calcula…'
request: |-
  Thực hiện đúng Bước 2.2 PLAN.md sau S21: persist TaxRuleSet, bậc thuế, metadata LegalBasis và khoảng kỳ áp dụng trong SQLite; seed tham khảo2025/2026; dựng TaxRuleProvider từ DB và chứng minh calculator dùng dữ liệu đọc lại, chặn duplicate/overlap. Tổ chức file gọn theo feature TaxRules với entity/configuration/mapper/loader/seeder/validation mỗi type chính một file, handwritten formatting nhiều dòng dễ đọc; tests theo hành vi Fixtures chung, Migrations riêng. Scope phù hợp input persistence2.1: base monthly salary/manual insurance (TaxRuleSet.Vietnam2025/Vietnam2026) trước; không mở rộng persistence full graph insurance/annual/bonus/extras/casual/multiple/charity/retirement trong một bước này. Nếu adapter nhận snapshot có attached optional rules phải reject rõ thay vì bỏ mất. Không thay công thức/Core/metadata pháp lý cũ.

  Cần planner giải quyết rõ policy dữ liệu: hiện TẤT CẢ seed production của Core Unverified/Missing (docs/legal-source-status.md), chưa có seed Verified; nhiều URL Chính phủ chưa thỏa vbpl gate. Không tự nâng Verified, đổi metadata/URL hoặc giả ngày hiệu lực. Giữ phân biệt PeriodFrom/To là kỳ tính thuế của TaxRuleRegistration với LegalBasis.EffectiveFrom/To là hiệu lực văn bản; FromYear chỉ label. Chỉ nạp nguồn verified vbpl chi tiết ở đường import/load chính thức (HTTPS đúng host vbpl.vn hoặc subdomain, trang chi tiết văn bản có ItemID, ID/version/VerifiedOn đầy đủ; loại root/search/list/lookalike). Đường seed/load tham khảo opt-in TƯỜNG MINH cho2025/2026 dùng dữ liệu/metadata Core nguyên trạng, giữ Unverified/Missing, không tự nạp trong constructor/normal startup/migration. Đường chính thức phải fail clearly nếu thiếu nguồn/chưa verified; docs và PLAN mô tả riêng hai đường, không làm yếu yêu cầu nguồn chính thức. Không phải làm audit pháp lý mới toàn bộ để triển khai persistence. Chỉ kiểm thông tin kỹ thuật từ official EF docs khi cần. Ghi rõ đây là scope monthly manual, không tuyên bố các rule graph chưa hỗ trợ đã được lưu đầy đủ.

  Thiết kế schema tối thiểu nhưng bảo toàn decimal chính xác (TEXT/native; không double/rounding), identity+version+ordered brackets+mọi metadata LegalBasis theo role và từng bracket, null vs Missing, period boundaries đúng full-month, constraints valid dates/year và FK, unique, no-overlap inclusive INSERT/UPDATE trong cùng timeline được hỗ trợ (DB trigger hoặc giao dịch kiểm tra đủ an toàn); không bịa từ khóa/id chứa luật. Seeder idempotent, all-or-nothing, cùng version nhưng data khác không âm thầm ghi đè; không bỏ qua overlap/corruption. Loader fresh-context fail rõ invalid/missing/corrupt rather than fallback hard-coded. Provider đọc từ DB dùng Core hiện có, không đưa EF/network vào Core. Baseline hiện HEAD c6418b2b2ddb86cac2e4b1c148b4ac8b2b77aca4 còn toàn bộ S21 chưa commit; Bint phải giữ nguyên thay đổi trước và review task diff riêng (bint task diff --all). Thêm migration kế tiếp, KHÔNG sửa/xóa initial migration S21; test upgrade từ initial có dữ liệu giữ nguyên profile/income/dependent và trigger cũ; fresh migration, down/up isolated synthetic DB và model consistency. Baseline197Core+15Data phải giữ xanh.

  SDK local .dotnet/dotnet.exe10.0.404, EF/tool10.0.15 cached. Env DOTNET_ROOT workspace/.dotnet và PATH; NUGET_PACKAGES workspace/.dotnet/nuget-packages; DOTNET_CLI_HOME TEMP/taxmanager-cli. Không nâng dependencies/config/models. Chạy lệnh build/test/migration trực tiếp trong development và ghi bằng chứng; GIỮ verify.command trống như cách task trước, không tự đề xuất command cần approval. Nếu sandbox mạng/cached restore gặp lỗi hãy hoàn thiện mã có thể làm rồi báo cụ thể; không bỏ dở việc format do dotnet format named pipe, tự format tay. Nếu Bint snapshot bị chặn .git/objects có thể dùng GIT_OBJECT_DIRECTORY tại TEMP + GIT_ALTERNATE_OBJECT_DIRECTORIES repository objects chỉ đọc, không đổi actual HEAD/index. Không fake commit để fixed findings; ghi bằng chứng để reviewer xác nhận ở round sau.

  Chỉ dữ liệu giả, không chạy migration trên DB người dùng. Không làm2.3 encryption/audit/Web/Identity, không stage/commit/unstage/reset/stash/push; người dùng tự commit. Không approve/--force/raw-edit state Bint. Bint roles hiện tại planner/reviewer gpt-6.1-sol, implementer gpt-6.1-terra; không thay. Tài liệu ADR0014, development guide, PLAN mục3/2.2 cập nhật đúng lựa chọn và scope; không sửa roadmap ledger/S21 ledger. Hoàn thiện code/docs/test rồi review độc lập.
