goal: 'S15b: Miễn thuế làm thêm, làm đêm và trần tiền ăn theo kỳ 2026'
request: |-
  Người dùng yêu cầu: “sang bước tiếp theo đi, nguồn pháp lý cho phần nào thế”. S15a đã done task01M7YBAX4GYN0XX7ZA6GQTDHC8. Thực hiện CHỈ S15b/BL-23b trong Bước1.5 PLAN.md và roadmap .bint/tasks/01M7WZSJJDNS1D97A7J19YN37T. User tự git add/commit/push. HIỆN S15a ĐANG ĐƯỢC USER STAGE, HEAD363cdaf: giữ nguyên staged/index và các thay đổi S15a có sẵn. Không unstage/reset/stash/stage/commit/push. Bint task diff so ảnh trước b-feat để review CHỈ thay đổi S15b, không lẫn diff stagedS15a. Root chỉ điều phối; planner/implementer/reviewer qua bint run, Codex models sol/terra/sol hiện tại, không thay config/PLAN/global/solution/csproj hoặc ledger/doc cũ. Shared tree. User đã cho phép AI tự tìm nguồn cơ quan chính thức mới nhất, giữ decimal không rounding. Không hỏi lại các dữ liệu/ủy quyền đã có. B-req chỉ ghi artifact Bint, không sửa application code; nếu có câu hỏi THỰC SỰ chặn thì ghi Q rõ.

  Phạm vi nghiệp vụ S15b: một cá nhân Việt Nam cư trú làm theo HĐLĐ thông thường tại cùng đơn vị hiện tại, VND, năm2026. Các khoản khai RIÊNG: (1) tiền làm thêm giờ, (2) tiền làm việc ban đêm, (3) tiền ăn giữa ca/ăn trưa BẰNG TIỀN từ01/07/2026. Các phụ cấp khác (trang phục/điện thoại/độc hại/vùng/nhà ở...), suất ăn/phiếu ăn/hiện vật, trả tiền ngày chưa nghỉ phép, khác nguồn/sau nghỉ việc, năm ngoài2026, UI/DB/đọcfile/timekeeping và S15c/d/e/f ngoài phạm vi, reject treatment unsupported hoặc tài liệu hóa API không nhận được. Chọn mô hình nhỏ có type enum explicit, ID ổn định Trim/Ordinal nhưS15a, ngày thực nhận, số tiền không âm decimal và provenance. Không phân loại bằng label/tên. Không tự suy mọi khoản overtime đều đủ điều kiện. Có thể để caller khai explicit phần tiền đáp ứng điều kiện, thời gian và mức luật định dựa trên bảng lương/chấm công/chứng từ, xác nhận eligibility tường minh; không tự tính lương giờ/mức lao động/giới hạn giờ hay giả vờ engine thẩm định. Phần khai đáp ứng luật có thể bằng0/toàn bộ/từng phần nhưng không vượt total; phần vượt chịu thuế. Amount qualified do caller cung cấp là input Missing, KHÔNG phải hằng số luật hardcode. Thuật toán áp dụng theo mode trong rule, đừng rải tỷ lệ/phần trăm/ngưỡng luật ra logic. Thiếu xác nhận/amount không được mặc định miễn toàn bộ. Nếu dùng `qualifiedAmount`, đặt tên/docs thể hiện đủ cả điều kiện/thời gian/mức và chứng từ; không đánh đồng phần trả cao hơn lương thường. Chứng từ không được chứng minh tự động.

  Root ĐÃ browse và trực tiếp xem scan chính thức NĐ253, đủ quy tắc cho nhánh nhỏ này:
  https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/7/253m-ndcp.signed.pdf (bản61trang)
  - trang5 Điều8(2)g: khoản tiền ăn giữa ca/ăn trưa do NSDLĐ chi vượt1,2triệu/người/tháng tính vào thu nhập; bữa ăn tổ chức/nấu/suất/phiếu có quy tắc riêng ngoài scope. Tiền ăn phải cộng nhiều dòng CÙNG THÁNG rồi áp trần 1.200.000đ một lần, không mỗi dòng mộttrần. Phân bổ miễn theo thứ tự ổn định do API/docs chốt, giữ per-line tổng/trần/miễn/chịu thuế.
  - trang18 Điều26(1): miễn tiền lương làmđêm/làmthêm tại nơi làmviệc phù hợp điều kiện và thời gian luật laođộng; tổchức lưu bảngkê hoặc chứngminh qua bảnglương/chấmcông/HĐLĐ/tàiliệu. Điều26(3): phần vượt mức luậtđịnh chịu thuế. QUY TẮC MỚI KHÔNG chỉ miễn phần trảcao hơn lương thường, không dùng TT111 cũ cho năm2026. Chỉ triển khai tính thuế từ qualified amount mà caller đã đối chiếu, không engine tựtính pháp luật laođộng.
  - trang30 Điều46(3) timing ngày thực nhận/chi trả, giốngS15a.
  - trang56–57 Điều69(1)a: lương cá nhâncưtrú áp dụng kỳ2026, riêng69(1)b tiền ăn trầnmới áp từ01/07/2026. Nên seed đủJan–Dec với OT/night, NHƯNG tiền ăn tựtínhtrần CHỈ Jul–Dec; input tiền ăn Jan–Jun phải reject rõ không córule, kể cả zero item nếu chọn hợp đồng như vậy. Không hồi tố cap vềJan, không tự bịa cap730k hoặc unlimited choJanJun. No-line JanJun vẫn annual12tháng được.
  - trang57 Điều70(2): đãkhai/nộp theo văn bản cũ trước hiệu lực không yêu cầu khai lại tháng/quý, điều chỉnh quyết toán2026. Kết quả tháng S15b là estimate theo bộ luật cho kỳ2026, KHÔNG tự thay thế actualwithheld/quyếtđịnh nộp tháng cũ. Document statutory effectiveJuly vs annual applicability vs mealException rõ.
