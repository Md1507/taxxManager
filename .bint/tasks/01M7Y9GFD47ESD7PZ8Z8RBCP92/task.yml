verify:
  command: ""
  criteria:
    - Khoảng giảm trừ người phụ thuộc có ID ổn định, bao hàm tháng đầu/cuối, hỗ trợ gián đoạn và cắt theo năm; từ chối khoảng sai, trùng hoặc chồng cùng ID và trả ID/khoảng/căn cứ theo từng tháng.
    - Đầu vào quyết toán có đúng 12 tháng duy nhất của năm 2026, tháng zero tường minh và tạm nộp thực tế bắt buộc; chuẩn hóa thứ tự, chọn đúng một cách nhập bảo hiểm tay hoặc tự tính S13 và không khấu trừ hai lần.
    - Thuế năm dùng tổng gross trừ tổng bảo hiểm và giảm trừ, giữ TNTT trước clamp, clamp một lần rồi áp biểu năm; trả tổng tạm nộp, chênh lệch thuế năm trừ tạm nộp, nộp thêm/nộp thừa dự kiến không âm và không cùng dương.
    - Rule năm 2026 tường minh nằm trong/liên kết TaxRuleSet, có biểu năm và căn cứ đúng kỳ; giữ GetForYear S12, chọn snapshot từng tháng, chấp nhận khác biệt bảo hiểm tháng 6/7 và từ chối thiếu/gap/mismatch hoặc thay đổi thuế giữa năm chưa hỗ trợ.
    - Kết quả bất biến giữ đủ 12 tháng, gross/bảo hiểm/giảm trừ/thuế tháng/tạm nộp, ID người phụ thuộc và provenance thực dùng; tổng năm truy được các snapshot tháng và rule năm, nguồn Unverified và số tự khai Missing, không tự rounding.
    - Validation từ chối null, ID rỗng, tiền âm, tháng/năm sai, đầu vào bảo hiểm mơ hồ và cấu hình thiếu/không khớp bằng lỗi rõ; decimal overflow không bị che và sửa collection đầu vào không đổi snapshot/kết quả.
    - Kiểm thử có expected độc lập bao phủ lịch phụ thuộc, đủ tháng, số học năm khác tổng tháng, tháng TNTT âm, ba chiều chênh lệch, biên thuế năm, bảo hiểm 6/7, lỗi và bất biến; giữ 55 ca cũ, test Core rồi solution thực chạy xanh.
    - Docs0005 ghi API, nguồn/điều khoản/kỳ, ví dụ độc lập, giới hạn ước tính và decimal, lựa chọn user tự commit cùng kết quả test thật; diff chỉ thuộc S14, không thêm package hay sửa API cũ/PLAN/config/setup/ledger cũ, review độc lập không còn lỗi nghiêm trọng.
