id: 01M7X40Y2FKFEA6V07M24276TS
goal: 'S11: Core tính thuế tháng, snapshot quy tắc/căn cứ và kiểm thử xUnit theo Bước1.1'
request: |-
  Người dùng yêu cầu làm bước tiếp theo sau S0 và cho biết có thể hỏi họ để họ tra thông tin trên web cơ quan thuế. Chỉ thực hiện Bước 1.1, BL-10 đến BL-15 theo PLAN.md và .bint/tasks/01M7WZSJJDNS1D97A7J19YN37T/plan.md, tasks.md. S0 01M7X1P1ED7J4C8Q1HSZRB09XQ đã done, SDK project-local .dotnet/dotnet.exe là 10.0.404; global.json đã pin, helper scripts/dev/activate-dotnet.ps1 đã có. Planner/reviewer gpt-6.1-sol, implementer gpt-6.1-terra, giữ nguyên cấu hình Codex. Không đọc/tác động .dotnet toàn bộ khi tìm source vì chứa SDK lớn.

  Đầu ra: TaxManager.sln (định dạng .sln theo quyết định S0), src/TaxManager.Core net10.0 thuần C# không package ngoài và tests/TaxManager.Core.Tests xUnit tham chiếu Core. Bracket, TaxRuleSet (FromYear, giảm trừ, biểu thuế, định danh phiên bản/kỳ và trạng thái căn cứ), PitCalculator tính lũy tiến từng phần không làm tròn, MonthlySalaryCalculator(grossIncome, insurance là tiền nhập vào, dependents, ruleSet) trả record chi tiết trung gian, phần thu nhập tính thuế âm do giảm trừ được chặn về 0. Mọi khoản tiền/thuế suất dùng decimal; số luật chỉ nằm ở bộ quy tắc, không hardcode thuật toán. Validation rõ cho đầu vào âm, dependents không hợp lệ, biểu thuế không hợp lệ; chọn exception .NET thông thường và ghi quyết định ngắn thay vì thêm framework. Thiết kế gọn, immutable/defensive snapshot đủ để kết quả không thay đổi khi cấu hình đầu vào bị sửa.

  Tạo TaxRuleSet.Vietnam2026 từ đúng số liệu người dùng đã đưa trong PLAN.md; TUYỆT ĐỐI ghi là dữ liệu tham khảo CHƯA XÁC MINH pháp lý. Orchestrator đã hỏi người dùng về nguồn gốc chính thức và kỳ áp dụng biểu 5 bậc/giảm trừ 2026; đang chờ họ tra. Việc đó không cản viết engine tổng quát và kiểm số học theo dữ liệu PLAN. Không thêm số luật, điều khoản hay ngày hiệu lực từ trí nhớ, không khẳng định dữ liệu đã xác minh; FromYear=2026 là nhãn dữ liệu trong PLAN, không tự quy thành ngày hiệu lực/chuyển tiếp. Chưa chọn luật theo ngày/năm tự động (đó là 1.2). Không tuyên bố phần đối chiếu pháp lý/người dùng tự kiểm đã hoàn tất khi chưa có phản hồi. Có thể ghi phần kỹ thuật đã xong và dữ liệu còn chờ xác minh trong tài liệu bàn giao.

  Metadata pháp lý trong Core độc lập Web/DB: ID và phiên bản rule/căn cứ, điểm/khoản/điều/số văn bản khi có thật, summary 2-3 câu khi được cung cấp, URL gốc vbpl.vn khi đã xác minh, kỳ/ngày áp dụng và trạng thái/ngày xác minh. Thiếu metadata phải biểu diễn rõ là missing/unverified, không chế nội dung luật hay URL. Các thành phần kết quả và từng phần tính thuế liên kết đúng căn cứ/snapshot thực dùng; chỉ thiết kế dữ liệu để UI ? sau này hiển thị, không HTML hay UI, không HTTP trong engine. URL không hợp lệ không được tự trở thành nguồn verified; cú pháp URL hợp lệ không phải bằng chứng pháp lý. Insurance là đầu vào người dùng, không tự coi tỷ lệ BH hoặc số nhập là đã được kiểm luật.

  Kiểm thử xUnit Theory toàn bộ 7 ca thu nhập tính thuế và 3 ca lương tại PLAN Bước1.1, dùng decimal test data (MemberData/TheoryData phù hợp). Thêm ca sát các ngưỡng, thu nhập tính thuế âm sau giảm trừ, số lẻ không làm tròn, validation đầu vào/biểu thuế, snapshot và mapping căn cứ đúng rule/version, missing/unverified và URL sai. Không test rỗng, không tự sinh expected bằng chính calculator. Đưa vài ca đối chiếu số học riêng để người dùng có thể tự bấm kiểm trong tài liệu, không ghi là họ đã xác nhận. Không cần dựng toàn bộ kỳ/2025, tự tính BH, quyết toán năm, thu nhập vãng lai, Web, Data hay DB.

  Chỉ thêm package cần thiết cho xUnit/test runner, chọn phiên bản cố định từ nguồn chính thức và tương thích SDK. Chạy kiểm hẹp Core.Tests rồi dotnet test TaxManager.sln khi đã restore. Luôn dùng host .dotnet/dotnet.exe hoặc kích hoạt helper; cho cache package tại .dotnet/nuget-packages (đã bị ignore). Sandbox agent đã biết chặn mạng: nếu restore NuGet không được, ghi rõ package/lệnh và phần source đã tạo để orchestrator cung cấp đầu vào dependency từ phiên có mạng; không đổi sandbox/harness/model và không báo test xanh khi chưa chạy. Không chạy code --version tại root vì tạo debug.log. Không cài lại SDK/Git/editor.

  Planner chỉ đọc và viết artifact tác vụ; không tạo code trong b-req. Implementer thực thi và ghi bằng chứng từng tiêu chí bằng bint task criteria; verify.command giữ trống vì chưa được người xác nhận riêng trong Bint, không gọi task approve. Reviewer đọc diff đúng tác vụ và kiểm bằng chứng/test độc lập phù hợp. Agents không commit; orchestrator sẽ commit đúng phạm vi sau review. Lượt này shared để người dùng thấy source ngay. Giữ nguyên PLAN.md, config Codex, global.json và setup S0. Tài liệu quyết định/bàn giao thêm dưới docs/decisions, không sửa snapshot roadmap cũ.
