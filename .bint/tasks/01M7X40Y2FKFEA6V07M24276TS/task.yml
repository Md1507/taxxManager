  command: ""
  criteria:
    - Có TaxManager.sln gồm đúng Core net10.0 và Core.Tests xUnit; tests tham chiếu Core, Core không có package ngoài hay phụ thuộc Web/DB.
    - Bracket/TaxRuleSet và snapshot Vietnam2026 dùng đúng dữ liệu PLAN bằng decimal, có validation nhất quán và trạng thái chưa xác minh; thuật toán không hardcode số luật.
    - PitCalculator và MonthlySalaryCalculator tính đúng từng phần, không làm tròn, xử lý thu nhập tính thuế âm về 0 và trả chi tiết; đầu vào sai có lỗi rõ.
    - Metadata và kết quả liên kết đúng căn cứ/version/kỳ thực dùng, độc lập Web/DB/mạng; thiếu hoặc URL sai không được coi là nguồn đã xác minh, snapshot không bị đổi theo đầu vào mutable.
    - Toàn bộ 10 ca số học Bước1.1 cùng kiểm biên/không làm tròn/validation/mapping/missing/unverified có test có ý nghĩa; dotnet test Core.Tests và toàn solution thực sự đạt sau restore.
    - Có hướng dẫn API/chạy test và ca số học cho người dùng tự đối chiếu; ghi rõ còn chờ nguồn pháp lý/người dùng kiểm, không tuyên bố đã xác minh luật hoặc đã có Web/DB.
    - Thay đổi đúng phạm vi, giữ PLAN.md/config/setup S0; đủ bằng chứng tiêu chí và review không còn lỗi nghiêm trọng chưa xử lý.
