goal: 'S15c: Khấu trừ theo lần chi trả thu nhập vãng lai, bộ quy tắc nửa cuối 2026'
request: |-
  Người dùng yêu cầu “tiếp tục đi, mà tôi tưởng tiền overtime, làm đêm hay ăn giữa ca là theo từng công ty”. Root đã giải thích: mứcchi thực tế theo công ty/hợpđồng nhưng tuân luậtlaođộng, miễnthuế theo luậtthuế; S15b nhậpactualpaid/qualified, chưa payrollchấmcông. Tiếp tục CHỈ S15c/BL-23c của Bước1.5 PLAN.md, roadmap .bint/tasks/01M7WZSJJDNS1D97A7J19YN37T; không thay S15b đểthêm cấu hình côngty. S15b task01M7YD4AHRXZR4V4E4X9TNVPP5 done, user đã tựcommit: HEAD5632733 (S15b), feff813 (S15a). Gitclean lúc bắtđầu. User tựstage/commit/push, tuyệtđối không gitadd/commit/push/unstage/stash/reset. Root chỉđiềuphối bint run; configCodex planner/reviewer sol,implementerterra, max_review_rounds3 đã đượcuserduyệt. Không đổi config/model/PLAN/global/solution/csproj/packages/ledgerold/docsold. Sharedtree, chỉ1bước. User trướcđó đãcho phép tự chọn nguồnchínhthức mới nhất và giữdecimalkhôngrounding; không hỏilại quyềntra hoặc dữliệuđãcó.

  Mục tiêu: tính/ghi nhận KHẤU TRỪ TẠI NGUỒN cho tiền lương/công/thùlao KHÔNG phải kinhdoanh của cá nhâncưtrú, chi trả bằng VND tại ViệtNam, khoản khai tườngminh HOÀNTOÀN CHỊUTHUẾ và thuộc phạmvi Điều50(2). Chọn API nhỏ, có singlepayment và batchcùng1payer nếu hợp lý để giữ paymentID/payerID/date/amount/subject/decision/căn cứ. Một payment tươngứng MỘT LẦN CHITRẢ hoàn chỉnh, không chia từngdòng/cộng ngưỡng theo tháng; caller tựgộpthànhphần của cùng lầnchi và khôngsplit/grossẩn. Chỉ hỗtrợ khôngHĐLĐ/HĐLĐdưới3tháng hoặc khoảntrảsaunghỉviệc thuộcĐiều50(2) do callerphânloại tườngminh (enum defaultUnspecifiedphảireject). Caller xácnhận cưtrú/khôngkinhdoanh/fullytaxable, khôngphânloạitừ label/tên. Khônghỗtrợ khôngcưtrú, HĐLĐtừ3tháng khiđanglàm, kinhdoanh/freelance thuộckinhdoanh, mixedtaxable+exempt, hiệnvật/ESOP/foreigncurrency/netgross-up, payroll/bảo hiểm/companypolicy, phụ cấpS15b, năm/datedrange ngoài scope. Unknown/unsupportedinput báo lỗi, khônggắn10% cho mọi khoảnđặt tênvãnglai. Tái sửdụng LegalBasis, TaxRuleSet/TaxRuleProvider. Numericrate/threshold chỉ trong bộrule liênkếtTaxRuleSet vàseed; calculator khônghardcode 5m/10% hay tự dùngbiểulũytiến/deductions/BH.

  Nguồn ROOT VỪA browse và xemscan: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/7/253m-ndcp.signed.pdf. Trang35–36 Điều50(2): lương/công/thùlao/chi khác cho cá nhâncưtrú khôngHĐ hoặcHĐdưới03tháng, bao gồmtrảsaunghỉviệc, mứcchi từ05triệu/lần trởlên bắtbuộckhấutrừ10% trênthu nhập trướckhitrả. Dưới05triệu/lần cóthểkhấutrừ10% khi cá nhân yêucầu. Camkết: cá nhân chỉcó thu nhập thuộcđốitượngkhấutrừtỷlệ này nhưng ướctính tổngchịuthuế sau giảmtrừgia cảnhchưađếnmứcphảinộp, gửi camkết theo mẫu tớitổchứcchitrả đểtạmthờichưakhấutrừ; người làmcamkết chịutráchnhiệm. Engine khôngtựxácminh mẫu/chứngtừ/nguồnthu kháchoặcdựđoánthuếcuốinăm. KhoảnHĐtừ03tháng trởlên đanglàm áp50(1) không dùngflat10%. Trang56–57 Điều69(1) hiệu lựcvănbản01/07/2026,69(1)a quyđịnh lươngcưtrú kỳ2026,70(2) khôngphảikhailại tháng/quýtrước hiệu lực màđiềuchỉnhquyếttoán2026. S15c factory CHỈ tựtính các LẦNCHITRẢ NHẬN 01/07/2026–31/12/2026; ngoài khoảng (June30/Jan2027/2025) reject, khôngdùngtrần5m suyngượcviệc khấutrừ lịch sửJanJun, không coi factory hạnchếH2 là kếsluậnphápluật khôngáp2026. Khôngcần cài bộcũ2m/TT111 năm2025 trongbước này. Ngày thựcnhận/chitrả Điều46(3) trang30 cónguồncùngPDF, không dựanămlabelthưởng.
  Nguồnprimary phụ đã lấy được: https://baochinhphu.vn/tra-luong-sau-khi-nghi-viec-tru-thue-tncn-ra-sao-102260910093753041.htm giải đápchínhthức nhắc50(2) và5m/10%. TrangMOF hỏi165521/163686/166796 là cácvướngmắcthresholdtrướchaysau miễn vàcamkết; rootkhôngdựavàocâuhỏiđểtựkếsluận, open165521 bịtimeout. Để tránh tựgiảiquyếtmixedgross, chỉscopefullytaxablepayments khôngbấtkhoảnmiễn, paid=taxableinput. Không lấy blog/dựthảo. Localartifact: C:/Users/LENOVO/AppData/Local/Temp/taxxManager-s14-sources/253m-ndcp.signed.pdf và PNG253-page-30.png,35.png,36.png,56.png,57.png rootđãxem; khôngtảilại/càiPDFdeps; khôngchéptoànvănPDFvàorepo. Giữcăn cứUnverified/VerifiedOnnull: chưa cóvbplURL đãđối chiếu đúngcontractVerified, khôngbịaID. Metadata đủID/version/kỳ/year/URLHTTPS/điều-khoản/summaryViệt2–3câu, inputamount/subject/actualdeclaration vẫnMissing, deriveddecision traceđúngsnapshotthực. Rule coverage là phạmvi hỗtrợproject, statutoryeffectiveJuly vàannualapplicability khácnhau ghi rõdocs/basis, tránhbịa ngàyhếthiệulựcDec31 làcủaluật.

