    - .gitignore
    - global.json
    - .dotnet/**
    - scripts/dev/**
    - docs/decisions/**
    - .bint/tasks/**
  deny:
    - PLAN.md
    - .bint/config.yml
    - src/**
    - tests/**
references:
  - .bint/tasks/01M7WZSJJDNS1D97A7J19YN37T/plan.md
  - PLAN.md
constraints:
  - Chỉ Bước 0 BL-00/BL-01. Giữ nguyên PLAN.md, cấu hình Codex và nội dung ngoài phạm vi; không tạo solution/project hoặc tính năng; không git init lại.
  - Cài SDK project-local từ nguồn Microsoft; không gỡ phần mềm, không sửa PATH lâu dài/profile/registry hay cấu hình máy; binaries và secrets không được đưa vào Git; các agent không commit.
  - 'Sửa quan hệ do orchestrator lập nhầm: phiếu 01M7WZSJJDNS1D97A7J19YN37T là tài liệu lập kế hoạch đã bàn giao ở planned, dùng làm references thay vì phụ thuộc hoàn thành workflow b-do triển khai. Không chạy thêm hoặc thay trạng thái phiếu roadmap. Chỉ thực hiện S0 đã được người dùng yêu cầu; giữ nguyên mọi scope.deny và không tự duyệt bất kỳ cổng nào.'
  - 'Khôi phục sau lỗi mạng của sandbox: orchestrator đã tải archive chính thức và kiểm SHA512 tại C:\Users\LENOVO\AppData\Local\Temp\taxxManager-sdk-10.0.404-win-x64.zip (303618098 bytes). URL gốc https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.404/dotnet-sdk-10.0.404-win-x64.zip. SHA512 chính thức 330ddd2665b43cd2e428216a0d8ea1ac7bb19b5434fdc530e62010dc3b52823a620bf95489d628e1ed6f5122401793ee4887cca4a019122361a1231497f632ee. Dùng archive local làm đầu vào, tự đối chiếu lại hash rồi cài vào .dotnet; không cần gọi mạng trong sandbox. Đã có đủ điều kiện để hoàn thành phần SDK và global.json. Log debug.log do code --version phát sinh đã được orchestrator bảo toàn sang TEMP, không còn trong repo; không gọi code --version lần nữa tại repo. Cập nhật tài liệu thành kết quả thực tế với đường cài online dùng curl.exe và đường dùng ZIP có sẵn; không để mô tả lỗi mạng cũ như trạng thái hiện tại. Kiểm helper kích hoạt/lặp/deactivate, phục hồi môi trường và từ cwd khác. Đối chiếu lại các tiêu chí 1,2,4,5 bằng bint task criteria sau khi thực hiện thành công; tiêu chí 3 đã có bằng chứng. Tiếp tục đúng cùng phạm vi, model Codex và các tệp của S0, không chạy bước1.1 hay sửa phiếu roadmap.'
