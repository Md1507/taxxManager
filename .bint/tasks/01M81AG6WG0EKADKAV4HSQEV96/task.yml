request: 'Tiếp tục đúng Bước 2.1 (S21/BL-30) trong PLAN.md: EF Core + SQLite lưu hồ sơ người dùng, thu nhập theo tháng và người phụ thuộc, có migration và integration tests thật. Người dùng bổ sung yêu cầu tổ chức file gọn, dễ điều hướng, dễ kiểm thử, dễ đọc: bổ sung quy ước cụ thể tại mục 3 PLAN.md; áp dụng Data/Data.Tests theo trách nhiệm/feature, mỗi type chính một file, tests/fixtures riêng, migrations riêng; không refactor toàn bộ Core trong bước này. Tạo dự án Data và Data.Tests và thêm solution. Planner xem các contract phase1 và chọn schema tối thiểu hợp lý, mô tả rõ dữ liệu hỗ trợ/chưa hỗ trợ, không giả vờ lưu trọn mọi calculator input nếu chưa có mapping. Dùng ID hồ sơ opaque, tên hiển thị tùy chọn; không tự thu CCCD/MST, chỉ dữ liệu giả. Kiểm thử migration trên DB file mới, đọc lại bằng context mới, relations/khóa ngoại/isolation/unique/time ranges và decimal fractional không mất độ chính xác. Tiền decimal, không đổi double hoặc tự làm tròn. Có tài liệu cách restore/test/migrate, quyết định schema và giới hạn scope. Không triển khai 2.2 rule DB/seeder hay 2.3 encryption/audit, Web/Identity. Bổ sung ignore database local nếu cần. Dùng official EF Core docs: https://learn.microsoft.com/en-us/ef/core/providers/sqlite/limitations và /testing/choosing-a-testing-strategy; NuGet hiện có EF10.0.15 target net10 (11.0.0 target net11, không nâng SDK). Verify phiên bản packages/tool tương thích rồi pin nhất quán. SDK local .dotnet/dotnet.exe, scripts/dev/activate-dotnet.ps1. Giữ Core thuần không EF dependencies và tất cả 197 tests hiện có. Baseline HEAD c6418b2b2ddb86cac2e4b1c148b4ac8b2b77aca4, tree sạch. Người dùng tự commit: tuyệt đối không stage/commit/unstage/reset/stash/push, không đổi index/HEAD; không approve, --force hoặc raw-edit state Bint. Không đổi cấu hình model/workflow. Scope chỉ bước2.1 và quy ước tổ chức file, docs liên quan. Triển khai và review độc lập qua roles đã cấu hình.'
