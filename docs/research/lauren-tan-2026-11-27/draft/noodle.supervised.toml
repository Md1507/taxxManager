# Independent starting configuration [c], not Lauren's personal config.
# Schema source: poteto/noodle at 82d2921c52370f23f29086de81ccfb600939c037,
# docs/reference/configuration.md and docs/concepts/modes.md.
# Review against your installed Noodle version before copying to .noodle.toml.
